<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2A5A">

<title>JANSAATHA AI — The right government scheme. For the right person. At the right time.</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇮🇳</text></svg>">
<style>
/* ================= JANSAATHA AI — Design System ================= */
:root{
  --navy:#0E2A5A; --navy-2:#173B78; --navy-soft:#E8EEF9;
  --green:#0F7B4F; --green-soft:#E4F4EC;
  --saffron:#F08A1D; --saffron-soft:#FDF1E2;
  --bg:#F5F8FC; --card:#FFFFFF; --ink:#111E33; --muted:#5A6B85; --line:#E1E8F3;
  --danger:#C62828; --danger-soft:#FDEAEA; --warn:#B26A00; --warn-soft:#FFF6E5;
  --ok:#0F7B4F; --shadow:0 2px 10px rgba(16,32,58,.06),0 12px 32px rgba(16,32,58,.06);
  --shadow-sm:0 1px 3px rgba(16,32,58,.08);
  --r:16px; --r-sm:10px; --r-pill:999px;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Noto Sans Tamil","Noto Nastaliq Urdu",Arial,sans-serif;
  --t:16px; --sp:16px; --maxw:1200px;
}
html.large-text{--t:19px}
html.high-contrast{--bg:#fff;--line:#0E2A5A;--muted:#26344C;--shadow:0 0 0 1px #0E2A5A;--shadow-sm:0 0 0 1px #0E2A5A}
html.reduced-motion *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--f);font-size:var(--t);line-height:1.55;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
a{color:var(--navy-2);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{line-height:1.22;margin:0 0 .5rem;letter-spacing:-.01em}
h1{font-size:2.1rem}h2{font-size:1.45rem}h3{font-size:1.15rem}h4{font-size:1rem}
p{margin:0 0 .7rem}
ul,ol{margin:.2rem 0 .8rem;padding-left:1.15rem}
li{margin:.25rem 0}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:6px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--sp)}
.narrow{max-width:820px}
.grid{display:grid;gap:var(--sp)}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.cols-3{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.cols-4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.stack>*+*{margin-top:12px}
.flex{display:flex;gap:10px;align-items:center}
.between{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.wrapflex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:.86rem}.tiny{font-size:.78rem}
.center{text-align:center}.right{text-align:right}.mt{margin-top:var(--sp)}.mt-s{margin-top:8px}.mb{margin-bottom:var(--sp)}
.hide{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* ---------- App bar ---------- */
.appbar{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.appbar-in{display:flex;align-items:center;gap:12px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--navy)}
.brand .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--saffron),var(--green) 55%,var(--navy));display:grid;place-items:center;color:#fff;font-size:18px}
.brand small{display:block;font-weight:600;font-size:.66rem;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.nav-links{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.nav-links a{padding:8px 11px;border-radius:var(--r-pill);font-size:.88rem;font-weight:600;color:var(--navy-2)}
.nav-links a:hover,.nav-links a.active{background:var(--navy-soft);text-decoration:none}
.appbar-actions{display:flex;gap:8px;align-items:center}
.badge-count{background:var(--saffron);color:#fff;border-radius:var(--r-pill);font-size:.68rem;padding:1px 6px;margin-left:4px;font-weight:800}
/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;background:var(--card);color:var(--navy);font:inherit;font-weight:700;font-size:.92rem;padding:11px 16px;border-radius:var(--r-pill);cursor:pointer;transition:transform .12s,box-shadow .12s,background .12s;text-decoration:none;min-height:44px}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm);text-decoration:none}
.btn-primary{background:var(--navy);color:#fff}
.btn-accent{background:var(--green);color:#fff}
.btn-saffron{background:var(--saffron);color:#241300}
.btn-outline{border-color:var(--line);background:#fff;color:var(--navy)}
.btn-ghost{background:transparent;color:var(--navy-2)}
.btn-danger{background:var(--danger);color:#fff}
.btn-lg{font-size:1.02rem;padding:15px 22px;min-height:52px}
.btn-sm{font-size:.82rem;padding:7px 12px;min-height:36px}
.btn-icon{width:44px;height:44px;padding:0;border-radius:var(--r-pill);font-size:1.05rem}
.btn[aria-pressed=true]{background:var(--navy-soft);border-color:var(--navy)}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:var(--r-pill);padding:8px 13px;font-size:.86rem;font-weight:600;cursor:pointer;color:var(--navy-2);min-height:40px}
.chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.sm{padding:5px 10px;font-size:.78rem;min-height:32px}
/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow-sm)}
.card.pad-l{padding:22px}
.card-hd{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.card-ft{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.scheme-card{display:flex;flex-direction:column;gap:10px}
.scheme-card h3{margin:0}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:800;padding:4px 9px;border-radius:var(--r-pill);background:var(--navy-soft);color:var(--navy);letter-spacing:.01em}
.badge.central{background:var(--navy-soft);color:var(--navy)}
.badge.state{background:var(--green-soft);color:var(--green)}
.badge.new{background:var(--saffron-soft);color:#8A4A00}
.badge.demo{background:#EFEFF5;color:#4A4A6A}
.badge.ok{background:var(--green-soft);color:var(--ok)}
.badge.review{background:var(--warn-soft);color:var(--warn)}
.badge.out{background:var(--danger-soft);color:var(--danger)}
.badge.arch{background:#E9E9EF;color:#4B4B60}
.badge.plain{background:#fff;border:1px solid var(--line);color:var(--muted)}
.why{background:var(--green-soft);border:1px solid #CBE8DA;border-radius:var(--r-sm);padding:10px 12px}
.why ul{margin:4px 0 0;padding-left:1.1rem}
.why li{font-size:.86rem}
/* ---------- Hero ---------- */
.hero{background:linear-gradient(180deg,#fff 0%,#EEF4FE 60%,#F5F8FC 100%);border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.hero-in{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:center;padding:46px 0 40px}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--green);background:var(--green-soft);padding:6px 12px;border-radius:var(--r-pill)}
.hero h1{font-size:2.6rem;margin:14px 0 10px}
.lead{font-size:1.1rem;color:var(--muted);max-width:56ch}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.trust-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:20px;font-size:.82rem;color:var(--muted)}
.trust-row b{color:var(--ink)}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat-v{font-size:1.5rem;font-weight:800;color:var(--navy)}
.stat-l{font-size:.78rem;color:var(--muted)}
.lang-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.lang-strip span{font-size:.8rem;background:#fff;border:1px solid var(--line);border-radius:var(--r-pill);padding:4px 10px;color:var(--navy-2)}
/* ---------- Voice ---------- */
.mic{width:104px;height:104px;border-radius:50%;border:0;background:radial-gradient(circle at 30% 30%,#2E5AA8,var(--navy));color:#fff;font-size:2.2rem;cursor:pointer;box-shadow:var(--shadow);display:grid;place-items:center}
.mic.on{background:radial-gradient(circle at 30% 30%,#F0A03D,var(--saffron));animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(240,138,29,.5)}70%{box-shadow:0 0 0 22px rgba(240,138,29,0)}100%{box-shadow:0 0 0 0 rgba(240,138,29,0)}}
.wave{display:flex;gap:5px;align-items:flex-end;height:56px;justify-content:center;margin-top:14px}
.wave i{display:block;width:7px;background:var(--navy-2);border-radius:4px;height:12px}
.wave.on i{animation:eq .9s infinite ease-in-out}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}.wave i:nth-child(6){animation-delay:.5s}.wave i:nth-child(7){animation-delay:.6s}
@keyframes eq{0%,100%{height:12px}50%{height:48px}}
/* ---------- Forms ---------- */
.field{margin-bottom:14px}
.label{display:block;font-weight:700;font-size:.88rem;margin-bottom:6px}
.input,.select,.textarea{width:100%;font:inherit;font-size:.95rem;padding:12px 13px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;color:var(--ink);min-height:46px}
.textarea{min-height:104px;resize:vertical}
.help{font-size:.78rem;color:var(--muted);margin-top:5px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;margin-bottom:8px;cursor:pointer}
.check input{margin-top:4px;width:20px;height:20px}
/* ---------- Steps / stepper ---------- */
.stepper{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.step{font-size:.8rem;font-weight:700;padding:6px 12px;border-radius:var(--r-pill);background:#fff;border:1px solid var(--line);color:var(--muted)}
.step.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.step.done{background:var(--green-soft);color:var(--green);border-color:#CBE8DA}
.bar-track{height:10px;background:#E9EEF7;border-radius:var(--r-pill);overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--navy-2));border-radius:var(--r-pill);transition:width .4s}
/* ---------- Tables ---------- */
.table{width:100%;border-collapse:collapse;font-size:.88rem;background:#fff}
.table th,.table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.table th{background:#F2F6FC;font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.table tr:hover td{background:#FAFCFF}
.scroll-x{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
/* ---------- Notifications / toasts ---------- */
.toast-stack{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:380px}
.toast{background:#fff;border:1px solid var(--line);border-left:5px solid var(--saffron);border-radius:var(--r-sm);padding:14px 16px;box-shadow:var(--shadow);animation:slide .3s}
@keyframes slide{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.toast h4{margin:0 0 4px;font-size:.95rem}
.notif{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;margin-bottom:10px}
.notif.unread{border-left:5px solid var(--navy-2);background:#FBFCFF}
.notif .ic{font-size:1.3rem}
/* ---------- Timeline (audit / journey) ---------- */
.timeline{position:relative;padding-left:26px}
.timeline:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;margin-bottom:14px}
.tl-dot{position:absolute;left:-24px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--navy-2);border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.tl-item.done .tl-dot{background:var(--green)}
.tl-item.now .tl-dot{background:var(--saffron)}
/* ---------- Guardian pipeline ---------- */
.pipeline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pipe-node{background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 11px;font-size:.8rem;font-weight:700;color:var(--navy)}
.pipe-node.hit{background:var(--green-soft);border-color:#CBE8DA;color:var(--green)}
.pipe-node.hold{background:var(--warn-soft);border-color:#F3DFB4;color:var(--warn)}
.arrow{color:var(--muted);font-weight:800}
.issue{border:1px solid var(--line);border-left:5px solid var(--muted);border-radius:var(--r-sm);background:#fff;padding:14px;margin-bottom:10px}
.issue.high{border-left-color:var(--danger)}
.issue.medium{border-left-color:var(--saffron)}
.issue.low{border-left-color:var(--navy-2)}
.issue.resolved{opacity:.6}
/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;background:rgba(9,20,40,.55);z-index:300;display:flex;align-items:flex-start;justify-content:center;padding:22px;overflow:auto}
.modal-card{background:#fff;border-radius:var(--r);max-width:880px;width:100%;box-shadow:var(--shadow);padding:22px;margin:auto}
/* ---------- Map ---------- */
.map-wrap{position:relative}
.map-wrap svg{width:100%;height:auto;max-height:560px}
.map-state{fill:#DCE6F6;stroke:#fff;stroke-width:1.2;cursor:pointer}
.map-state:hover{fill:var(--saffron)}
.map-state.on{fill:var(--green)}
/* ---------- Simple / low data modes ---------- */
html.simple-mode .btn{min-height:58px;font-size:1.06rem}
html.simple-mode .chip{min-height:54px;padding:14px 20px;font-size:1rem}
html.simple-mode .nav-links a{font-size:.95rem;padding:12px 14px}
html.simple-mode .hero-art,html.simple-mode .decorative{display:none}
html.simple-mode .small,html.simple-mode .tiny{font-size:.94rem}
html.simple-mode p{font-size:1.06rem}
html.low-data .decorative,html.low-data .hero-art{display:none}
html.low-data .appbar{backdrop-filter:none}
/* ---------- Footer ---------- */
.site-footer{margin-top:44px;background:var(--navy);color:#DCE6F6;padding:30px 0 40px;font-size:.86rem}
.site-footer a{color:#fff}
.disclaimer{background:#122E5E;border:1px solid #2A4A85;border-radius:var(--r-sm);padding:12px 14px;margin-bottom:16px;font-size:.84rem;color:#CFE0F8}
/* ---------- Mobile ---------- */
.bottomnav{display:none}
@media(max-width:900px){
  .hero h1{font-size:1.95rem}
  .hero-in{grid-template-columns:1fr;padding:28px 0}
  .nav-links{display:none}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:80;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:6px 2px 8px}
  .bottomnav a{flex:1;text-align:center;font-size:.66rem;font-weight:700;color:var(--muted);padding:4px 2px;text-decoration:none}
  .bottomnav a span{display:block;font-size:1.25rem}
  .bottomnav a.active{color:var(--navy-2)}
  body{padding-bottom:74px}
  .toast-stack{left:12px;right:12px;bottom:86px;max-width:none}
  h1{font-size:1.7rem}
  .card{padding:15px}
}
@media print{.appbar,.bottomnav,.toast-stack,.no-print{display:none}}

</style>
</head>

  const dict = { en, hi, mr };
  Object.keys(core).forEach(c => { dict[c] = Object.assign({}, core[c]); });

  let current = 'en';
  const t = (k) => {
    const d = dict[current] || {};
    return (d[k] !== undefined ? d[k] : (en[k] !== undefined ? en[k] : k));
  };
  const setLang = (c) => { current = c; };
  const getLang = () => current;
  const langMeta = (c) => languages.find(l => l.code === c) || languages[0];
  // Keys a language is missing (drives Guardian "Missing translation" issues)
  const missingKeys = (code) => {
    if (code === 'en') return [];
    const d = dict[code] || {};
    return Object.keys(en).filter(k => d[k] === undefined);
  };
  const coverage = (code) => {
    const total = Object.keys(en).length;
    const miss = missingKeys(code).length;
    return { total, missing: miss, pct: Math.round(((total - miss) / total) * 100) };
  };
  return { languages, t, setLang, getLang, langMeta, missingKeys, coverage, dict };
})();

  function ageFits(age, band) {
    if (!age || !band) return null;

    const nums = (b.match(/\d+/g) || []).map(Number);
    if (!nums.length) return null;
    if (b.includes('+') && nums.length === 1) return a >= nums[0];

  function match(profile, scheme) {

    // 1. Location

    // 2. Citizen type / beneficiary
    const types = (p.types || []).map(norm);
    let typeHit = false;
    types.forEach(t => {
      const meta = D().CITIZEN_TYPES.find(c => c.k === t || norm(c.label) === t);
      const label = meta ? meta.label : t;
      const hit = (scheme.beneficiary || []).some(b => norm(b) === norm(label)) ||
                  (scheme.occupation || []).some(o => norm(o) === norm(label)) ||
                  norm(scheme.beneficiary.join(' ')).includes(norm(label).split(' ')[0]);
      if (hit) { typeHit = true; score += 15; reasons.push({ text: label, s: 'match' }); }
    });

    (p.interests || []).forEach(i => {

    const age = p.age ? Number(p.age) : null;

    else if (af === false) { score -= 30; reasons.push({ text: 'Age ' + age + ' outside ' + scheme.ageGroup, s: 'fail' }); }

  /* ---------- Guardian confidence routing ---------- */
  function guardianRoute(change) {
    const c = change || {};
    const critical = ['eligibility','benefit','deadline','officialUrl','application'].includes(c.field);

function explainCondition(t) {
  var l = String(t).toLowerCase();
  if (l.indexOf('landholding') >= 0 || l.indexOf('land record') >= 0) return 'You must own or cultivate agricultural land registered in your name. The village revenue office keeps this record.';
  if (l.indexOf('aadhaar') >= 0) return 'Aadhaar is the identity document used to verify who you are. The bank account should be linked to it.';
  if (l.indexOf('income') >= 0 || l.indexOf('poverty') >= 0 || l.indexOf('bpl') >= 0) return 'Your household income must be below a limit set by the scheme. An income or BPL certificate from the revenue office proves this.';
  if (l.indexOf('age') >= 0) return 'You must fall inside the age range on the day you apply. Age is taken from Aadhaar or a birth certificate.';
  if (l.indexOf('rural') >= 0) return 'The scheme is meant for households living in a village or rural area.';
  if (l.indexOf('urban') >= 0) return 'The scheme is meant for households living in a town or city.';
  if (l.indexOf('domicile') >= 0 || l.indexOf('resident') >= 0) return 'You must be a permanent resident of that state, proven by a domicile certificate.';
  if (l.indexOf('enrol') >= 0 || l.indexOf('institution') >= 0 || l.indexOf('course') >= 0) return 'You must be studying in a recognised institution in a recognised course.';
  if (l.indexOf('not a member') >= 0 || l.indexOf('epfo') >= 0) return 'You must not already be covered by another statutory pension or insurance scheme.';
  if (l.indexOf('greenfield') >= 0) return 'This must be your first venture in that line of business.';
  if (l.indexOf('trade') >= 0) return 'You must be working in one of the listed traditional trades (carpenter, potter, tailor, blacksmith, etc.).';
  if (l.indexOf('ration') >= 0) return 'Your household must hold a valid ration card issued by the state.';
  if (l.indexOf('disab') >= 0) return 'A disability certificate from a government medical authority is normally required.';
  return 'Read this condition as a checklist item and confirm the exact wording on the official portal before applying.';
}

  save(); renderChat();
  var a = document.getElementById('ask'); if (a) a.value = '';
  if (S().a11y.tts) speak(chatLog()[chatLog().length - 1].html.replace(/<[^>]+>/g, ' ').slice(0, 400));
}

document.addEventListener('click', function (ev) {
  var el = ev.target.closest ? ev.target.closest('[data-act]') : null; if (!el) return;
  var act = el.getAttribute('data-act'), id = el.getAttribute('data-id'), arg = el.getAttribute('data-arg');
  var s = id ? SC().find(function (x) { return x.id === id; }) : null;

  if (act === 'wow') { window.JS_AGENTS.wow(id, true); return; }
  if (act === 'runagents') { window.JS_AGENTS.sweep(); return; }
  if (act === 'resetdemo') { window.JS_STORE.reset(); window.JS_AGENTS.reset(); window.JS_ROUTE.go('#/admin'); return; }
  if (act === 'fixissue' || act === 'approveissue' || act === 'rejectissue' || act === 'investigate') {
    var q = S().guardian.queue.length ? S().guardian.queue : (S().guardian.queue = JSON.parse(JSON.stringify(D().ISSUES)));
    var it = q.find(function (x) { return x.id === Number(id); });
    if (!it) return;
    var stamp = new Date().toISOString().slice(0, 19).replace('T', ' ');

      old: it.type, neu: status, approval: act === 'approveissue' ? 'Human approved' : act === 'rejectissue' ? 'Human rejected' : 'Auto-approved (non-factual)',

  }

  if (act === 'detectrun') { window.JS_AGENTS.detect(); return; }

      action: 'Translation agent filled missing strings from the approved glossary where a safe equivalent existed',
      source: 'internal glossary', conf: 'High', old: filled + ' languages with gaps', neu: filled + ' languages still with gaps (needs a human translator for accuracy)',
      approval: 'Auto-approved (non-factual)', admin: 'guardian-bot', result: 'Partially fixed' });
    save(); U().toast('Translation agent finished', 'Safe glossary equivalents were filled. Remaining gaps stay open — machine wording is not published for scheme facts.'); window.JS_ROUTE.render(); return;
  }
  if (act === 'notifjob') { U().toast('Dispatch simulated', 'Job completed: recipients filtered by profile match and notification preferences before sending.'); return; }
  if (act === 'exportaudit') {
    var log = S().guardian.audit.length ? S().guardian.audit : D().AUDIT;
    var b = new Blob([JSON.stringify(log, null, 2)], { type: 'application/json' }), u = URL.createObjectURL(b);
    var a = document.createElement('a'); a.href = u; a.download = 'jansaatha-audit-log.json'; document.body.appendChild(a); a.click(); a.remove();

  }
  if (act === 'newscheme') {
    window.JS_ADMIN_NEW = true;
    U().toast('Add scheme', 'The demo publishes through the agent pipeline instead — use “Admin publishes a scheme” on the dashboard so detection, matching and alerts all run for real.');
    window.JS_ROUTE.go('#/admin'); return;

    if (!s) return;

      s.verification = 'Verified'; s.verifiedOn = new Date().toISOString().slice(0, 10); s.verifiedBy = 'admin (demo)';
      S().guardian.audit.unshift({ ts: new Date().toISOString().slice(0, 19).replace('T', ' '), issue: '—', action: 'Administrator re-verified the official source URL',
        source: s.domain, conf: 'High', old: 'Needs Review', neu: 'Verified · ' + s.verifiedOn, approval: 'Human approved', admin: 'admin (demo)', result: 'Updated' });
      save(); U().toast('Record verified', esc(s.name) + ' → Verified (' + s.verifiedOn + ')'); window.JS_ROUTE.render();
    } else if (act === 'archivescheme') {

        source: s.domain, conf: 'High', old: 'Active / ' + 'verified', neu: 'Archived', approval: 'Human approved', admin: 'admin (demo)', result: 'Updated' });
      save(); U().toast('Record archived', esc(s.name) + ' is hidden from recommendations and marked ⚫ Archived.'); window.JS_ROUTE.render();
    } else {
